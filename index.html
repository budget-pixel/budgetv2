  /* Shown in these cards' <strong> figure while loadBudgetData() is in
     flight -- three dots that bounce in sequence rather than static
     placeholder text, so it's visually obvious the value is still
     loading rather than reading as a real (tiny/blank) figure. */
  .wc-loading-dots{ display:inline-flex; gap:3px; align-items:center; vertical-align:middle; }
  .wc-loading-dots span{
    width:6px; height:6px; border-radius:50%; background:currentColor;
    display:inline-block; animation:wcLoadingDotBounce 1s infinite ease-in-out both;
  }
  .wc-loading-dots span:nth-child(2){ animation-delay:.15s; }

  @keyframes wcLoadingDotBounce{

<script src="assets/brand-logo.js?v=20260723-asset-path-cleanup"></script>
<script>
  (function(){
    function initLogo(){
      if(window.WaltonSplitLogo){
        document.querySelector(".logo-container").innerHTML = window.WaltonSplitLogo.getHtml("", "");
        window.WaltonSplitLogo.equalizeAll();
      }
    }
    // grok-video-a964bba7-boomerang-loop.mp4 is a pre-built loop: the
    // flattest-luma 1.50s-3.54s slice of the original clip (see git
    // history for how that window was measured), played forward then
    // immediately reversed back over itself (ffmpeg reverse+concat).
    // Trimming for flat brightness alone still left a motion jump at the
    // restart -- waves/clouds/pan don't land back at their starting
    // position just because the brightness matches. Forward-then-reverse
    // guarantees the very last frame IS the very first frame, so the
    // native <video loop> restart has zero discontinuity to hide: nothing
    // jumps, brightness or otherwise, because nothing actually changes
    // across that seam.
    function initStartVideo(){
      var video = document.querySelector(".wc-start-video");
      if(!video) return;
      if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
        video.pause();
        return;
      }
      function setCalmPlayback(){
        video.defaultPlaybackRate = 0.25;
        video.playbackRate = 0.25;
      }
      setCalmPlayback();
      video.addEventListener("loadedmetadata", setCalmPlayback, { once:true });
    }
    function initBudgetLandingDialog(){
      var trigger = document.querySelector(".wc-home-start");
      var dialog = document.querySelector("[data-budget-landing-dialog]");
      var frame = document.querySelector("[data-budget-landing-frame]");
      var wave = dialog ? dialog.querySelector(".wc-budget-landing-wave") : null;
      if(!trigger || !dialog || !frame) return;

      function openDialog(event){
        if(event) event.preventDefault();
        dialog.hidden = false;
        dialog.classList.add("is-loading");
        document.documentElement.classList.add("wc-budget-landing-open");
        document.body.classList.add("wc-budget-landing-open");
        if(!frame.getAttribute("src")) frame.setAttribute("src", frame.dataset.src || "home.html?embed=landing");
        if(wave && !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)){
          wave.defaultPlaybackRate = 0.25;
          wave.playbackRate = 0.25;
          var playPromise = wave.play();
          if(playPromise && typeof playPromise.catch === "function") playPromise.catch(function(){});
        }
      }

      frame.addEventListener("load", function(){
        try{
          var embeddedDocument = frame.contentDocument;
          embeddedDocument.documentElement.classList.add("wc-embedded-budget-landing");
          var embeddedStyle = embeddedDocument.createElement("style");
          embeddedStyle.textContent = 'nav#nav-menu,footer[role="contentinfo"]{display:none!important}' +
            '#layout{display:block!important;min-height:100vh!important}' +
            '.wc-explorer-home{padding-top:18px!important}';
          embeddedDocument.head.appendChild(embeddedStyle);
        }catch(error){}
        dialog.classList.remove("is-loading");
        frame.focus();
      });
      trigger.addEventListener("click", openDialog);
    }
    function init(){
      initLogo();
      initStartVideo();
      initBudgetLandingDialog();
    }
    if(document.readyState === "loading"){
      document.addEventListener("DOMContentLoaded", init);
    }else{
      init();
    }
  })();
</script>
