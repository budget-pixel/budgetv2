<body>

<div id="layout">
<main id="content">

<div class="page-eyebrow">Financial Overview</div>
<h1 class="page-title">Financial Overview</h1>
<p class="page-intro">Explore Walton County's financial resources, including the budget process, financial policies, debt, fund activity, property tax allocation, and financial reports.</p>

<section aria-label="Budget overview directory">
  <ul class="wc-directory-list" id="hubList"></ul>
</section>

</main>
</div>

<script src="../assets/search-data.js"></script>
<script src="../assets/budget-data.js?v=20260807-ledger-directory-entries"></script>
<script src="../assets/cip-projects-data.js?v=20260802-fund-placeholders"></script>
<script src="../assets/cip-overview.js?v=20260802-capital-callout"></script>
<script src="../assets/nav.js?v=20260807-breadcrumb-ledgers"></script>
<script src="../assets/budget-pdf.js?v=20260723-asset-path-cleanup"></script>
<script>
  (function(){
    var pages = [
      {
        title:"Consolidated Budget Ledger",
        href:"consolidated-financial-schedules.html",
        label:"All Funds",
        description:"Review combined County financial schedules across funds, revenues, expenses, transfers, and balances."
      },
      {
        title:"Revenue Ledger",
        href:"revenue-ledger.html",
        label:"Revenue",
        metric:"revenue",
        description:"The complete FY 2027 revenue classification schedule, by revenue category and source, with prior-year comparisons."
      },
      {
        title:"Personnel Ledger",
        href:"personnel-ledger.html",
        label:"Personnel",
        metric:"personnel",
        description:"Review FY 2027 personnel cost and staffing by Board department, Constitutional Officer, function, or fund."
      },
      {
        title:"Department Ledger",
        href:"department-ledger.html",
        label:"Board Departments",
        metric:"department",
        description:"Compare proposed spending and major cost categories across Board departments."
      },
      {
        title:"Constitutional Officers Ledger",
        href:"constitutional-ledger.html",
        label:"Constitutional Officers",
        metric:"constitutionalOfficers",
        description:"Compare staffing and proposed spending across the Board of County Commissioners and the five independently elected offices."
      },
      {
        title:"Independent Agencies Ledger",
        href:"independent-agencies-ledger.html",
        label:"Independent Agencies",
        description:"Budget, staffing, fund, and year-over-year change for the Courts, Health Department, and other independent and autonomous entities."
      },
      {
        title:"Machinery, Vehicles, & Equipment Ledger",
        href:"summary-of-machinery-vehicles-and-equipment.html",
        label:"Capital",
        metric:"capitalMachinery",
        description:"Review budgeted machinery, vehicles, and equipment by department, fund, and equipment type."
      },
      {
        title:"Transportation and Infrastructure Ledger",
        href:"cip-capital-projects.html",
        label:"Capital",
        metric:"capitalTransportation",
        description:"Review Transportation Fund, Capital Projects Fund, and grant-funded infrastructure in one schedule, with the funding source identified for every project."
      },
      {
        title:"Tourist Development Fund Ledger",
        href:"cip-tourist-development.html",
        label:"Capital",
        metric:"capitalTouristDevelopment",
        description:"Explore tourism-related capital investments funded through tourist development resources."
      },
      {
        title:"Sheriff Project Ledger",
        href:"cip-sheriff.html",
        label:"Capital",
        metric:"capitalSheriff",
        description:"Review all capital projects associated with the Walton County Sheriff's Office."
      },
      {
        title:"Recreation Plat Fee Fund Ledger",
        href:"recreation-plat-fee-fund.html",
        label:"Capital",
        metric:"capitalRecreationPlatFee",
        description:"Review the Recreation Plat Fee Fund's FY 2027 budgeted capital amount, pending Board direction on specific projects."
      },
      {
        title:"Sidewalk Fund Ledger",
        href:"sidewalk-fund.html",
        label:"Capital",
        metric:"capitalSidewalk",
        description:"Review the Sidewalk Fund's FY 2027 budgeted capital amount, pending Board direction on specific projects."
      },
      {
        title:"Debt Ledger",
        href:"debt-overview.html",
        label:"Debt & Obligations",
        metrics:[
          { key:"debtPrincipal", label:"Principal" },
          { key:"debtInterest", label:"Interest" }
        ],
        description:"Explore outstanding debt, annual debt service, borrowing strategy, and long-term obligations."
      },
      {
        title:"Fund Financial Ledger",
        href:"fund-financial-schedules.html",
        label:"Fund Detail",
        description:"Explore fund-level financial schedules for major operating, special revenue, and capital funds."
      },
      {
        title:"Interfund Transfer Ledger",
        href:"summary-of-interfund-transfers.html",
        label:"Transfers Between Funds",
        description:"Review planned transfers into and out of County funds and see how resources move between funds to support services, projects, and obligations."
      },
      {
        title:"Table of Contents",
        href:"table-of-contents.html",
        description:"Browse every budget section, county directory, and supporting page."
      },
      {
        title:"GFOA Distinguished Budget Presentation Award",
        href:"gfoa-distinguished-budget-presentation-award.html",
        label:"Recognition",
        description:"Review the award standards and presentation recognition for Walton County's budget document."
      },
      {
        title:"Budget Process",
        href:"budget-process.html",
        label:"Process",
        description:"Explore budget development, the calendar, budget changes, financial policies, fund structure, and department funding relationships."
      },
      {
        title:"Program Budget",
        href:"program-budget.html",
        label:"Programs & Service Levels",
        description:"Explore major services across departments, including cost, funding, service measures, community impact, and alignment with County priorities."
      },
      {
        title:"Property Tax Allocation",
        href:"summary-of-property-tax-allocations.html",
        label:"Property Tax",
        description:"See the dollar amount each department receives from the countywide property tax."
      },
      {
        title:"Summary of Expenses",
        href:"summary-of-expenses.html",
        label:"Expenses",
        description:"Browse expenditure summaries by function, fund, and budget category for the proposed fiscal year."
      },
      {
        title:"Budget Change Summary",
        href:"summary-of-budget-changes-and-adjustments.html",
        label:"Changes",
        description:"Compare proposed expenditures to the prior budget by department, showing both increases and decreases."
      },
      {
        title:"Summary of Contractual Services",
        href:"summary-of-contractual-services.html",
        label:"Contracts",
        description:"Review budgeted contractual services and outside-vendor spending by department.",
        darkModeOnly:true
      },
      {
        title:"Financial Forecast",
        href:"financial-forecast.html",
        label:"Forecast",
        description:"Review long-range financial assumptions, revenue outlook, expense projections, and planning considerations."
      },
      {
        title:"Transaction Search",
        href:"transaction-search.html",
        label:"Raw Data",
        description:"Search every public vendor payment and revenue receipt on file since FY 2020 by vendor, amount, date, or fund."
      },
      {
        title:"Supporting Budget Documentation",
        href:"supporting-budget-documentation.html",
        label:"Documents",
        description:"Open supporting budget requests, certifications, policies, ordinances, fee schedules, and reference workbooks."
      }
    ];

    function $(selector){
      return document.querySelector(selector);
    }

    function escapeHtml(value){
      return String(value === undefined || value === null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function statHtml(key, label){
      return '<div class="wc-directory-item-stat wc-directory-item-stat--overview-budget" data-budget-overview-total="' + escapeHtml(key) + '"><strong><span class="wc-loading-dots" aria-label="Loading total"><span></span><span></span><span></span></span></strong><span>' + escapeHtml(label) + '</span></div>';
    }

    function metaHtml(page){
      if(page.metrics){
        return '<div class="wc-directory-item-meta">' + page.metrics.map(function(m){ return statHtml(m.key, m.label); }).join("") + '</div>';
      }
      if(page.metric){
        return '<div class="wc-directory-item-meta">' + statHtml(page.metric, "FY 2027 Proposed") + '</div>';
      }
      return "";
    }

    function renderHub(){
      $("#hubList").innerHTML = pages.map(function(page){
        var liClass = page.darkModeOnly ? ' class="wc-dark-mode-only"' : "";
        return '<li' + liClass + '><a class="wc-directory-item" href="' + escapeHtml(page.href) + '">' +
          '<div class="wc-directory-item-main">' +
            '<span class="wc-directory-item-title">' + escapeHtml(page.title) + '</span>' +
            '<span class="wc-directory-item-desc">' + escapeHtml(page.description) + '</span>' +
          '</div>' +
          metaHtml(page) +
          '<span class="wc-directory-item-arrow" aria-hidden="true">&rarr;</span>' +
        '</a></li>';
      }).join("");
    }

    function normalize(value){
      return String(value || "").toLowerCase().replace(/&/g, " and ").replace(/['’]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
    }

    function renderBudgetTotals(){
      if(!window.WCBudgetData || typeof window.WCBudgetData.loadBudgetData !== "function") return;
      window.WCBudgetData.loadBudgetData().then(function(data){
        var revenueTotal = (data.revenues || []).reduce(function(sum, row){
          var fundCode = String(row.Dept_Code || "").trim().slice(0, 3);
          var revenueCode = String(row.Revenue_Code || "").trim();
          if(fundCode === "503" || revenueCode === "381000") return sum;
          return sum + (Number(row.FY2027_Proposed) || 0);
        }, 0);

        var personnelCodes = new Set(["510000", "511000", "512000", "512007", "513000", "514000", "521000", "522000", "523000", "524000", "525000"]);
        var personnelTotal = (data.expenditures || []).reduce(function(sum, row){
          if(String(row.Object_Type || "").trim() !== "Personnel Services") return sum;
          if(!personnelCodes.has(String(row.Object_Code || "").trim())) return sum;
          return sum + (Number(row.FY2027_Proposed) || 0);
        }, 0);

        var constitutionalOfficersTotal = window.WCBudgetData.getConstitutionalOfficersBudgetTotal(data);
        var departmentTotal = window.WCBudgetData.getDepartmentBudgetTotal(data);
        var debtTotals = window.WCBudgetData.getDebtOverviewTotals();

        var totals = { revenue:revenueTotal, personnel:personnelTotal, constitutionalOfficers:constitutionalOfficersTotal, department:departmentTotal, debtPrincipal:debtTotals.principal, debtInterest:debtTotals.interest };
        document.querySelectorAll("[data-budget-overview-total]").forEach(function(element){
          var key = element.dataset.budgetOverviewTotal;
          if(!(key in totals)) return;
          var amount = totals[key] || 0;
          var useRoundedMillions = ["revenue", "personnel", "constitutionalOfficers", "department", "debtPrincipal", "debtInterest"].indexOf(key) !== -1;
          element.querySelector("strong").textContent = useRoundedMillions
            ? "$" + Math.round(amount / 1000000).toLocaleString("en-US") + "M"
            : window.WCBudgetData.formatCurrency(amount);
        });
      }).catch(function(){
        document.querySelectorAll("[data-budget-overview-total]:not([data-budget-overview-total='capital']) strong").forEach(function(element){element.textContent = "Not available";});
      });
    }

    function renderCapitalTotal(){
      var element = document.querySelector("[data-budget-overview-total='capital']");
      if(!element) return;
      var ready = window.wcCipProjectsReady || Promise.resolve(window.wcCipProjects || []);
      ready.then(function(projects){
        var searchable = (typeof getSearchableProjects === "function") ? getSearchableProjects() : (projects || []);
        var stats = (typeof getCipOverviewStats === "function") ? getCipOverviewStats(searchable) : { totalBudget:0 };
        element.querySelector("strong").textContent = "$" + Math.round(stats.totalBudget / 1000000).toLocaleString("en-US") + "M";
      }).catch(function(){
        element.querySelector("strong").textContent = "Not available";
      });
    }

    // Amount callouts for the six capital ledger cards added to this
    // directory -- reuses the exact same funding-source matchers
    // capital-projects.html's own ledger cards use (see that page's
    // pageProjectMatches/ledgerCardStats), plus the same FY2027 capital
    // outlay by fund code it derives from budget-data.js, so the numbers
    // shown here always match what each ledger page itself reports.
    var CAPITAL_LEDGER_PROJECT_MATCHERS = {
      capitalTransportation: function(project){
        if(String(project && project.department_filter || "").toLowerCase() === "sheriff") return false;
        var funding = String(project && project.funding || "").toLowerCase();
        return funding === "transportation fund" || funding === "capital projects fund" || funding === "general fund";
      },
      capitalTouristDevelopment: function(project){
        return String(project && project.funding || "").toLowerCase() === "tourist development fund" &&
          String(project && project.title || "").toLowerCase().indexOf("us 331 bridge lighting") === -1;
      },
      capitalSheriff: function(project){
        return String(project && project.department_filter || "").toLowerCase() === "sheriff" &&
          String(project && project.funding || "").toLowerCase() !== "grant funded";
      }
    };
    var CAPITAL_LEDGER_FUND_CODES = { capitalRecreationPlatFee:"114", capitalSidewalk:"115" };

    function setCapitalLedgerAmount(key, amount){
      var element = document.querySelector("[data-budget-overview-total='" + key + "']");
      if(!element) return;
      element.querySelector("strong").textContent = (typeof formatMoneyShort === "function") ? formatMoneyShort(amount) : window.WCBudgetData.formatCurrency(amount);
    }

    function renderCapitalLedgerFundTotals(){
      if(!window.WCBudgetData || typeof window.WCBudgetData.loadBudgetData !== "function") return;
      window.WCBudgetData.loadBudgetData().then(function(data){
        var machineryTotal = (data.machinery || []).reduce(function(sum, row){ return sum + (Number(row.Amount) || 0); }, 0);
        setCapitalLedgerAmount("capitalMachinery", machineryTotal);

        var capitalOutlayByFund = {};
        (data.expenditures || []).forEach(function(row){
          if(String(row.Object_Type || "").trim().toLowerCase() !== "capital outlay") return;
          var amount = Number(row.FY2027_Proposed) || 0;
          if(!amount) return;
          var fundCode = String(row.Dept_Code || "").trim().slice(0, 3);
          if(!fundCode) return;
          capitalOutlayByFund[fundCode] = (capitalOutlayByFund[fundCode] || 0) + amount;
        });
        Object.keys(CAPITAL_LEDGER_FUND_CODES).forEach(function(key){
          setCapitalLedgerAmount(key, capitalOutlayByFund[CAPITAL_LEDGER_FUND_CODES[key]] || 0);
        });
      }).catch(function(){
        setCapitalLedgerAmount("capitalMachinery", 0);
        Object.keys(CAPITAL_LEDGER_FUND_CODES).forEach(function(key){ setCapitalLedgerAmount(key, 0); });
      });
    }

    function renderCapitalLedgerProjectTotals(){
      var ready = window.wcCipProjectsReady || Promise.resolve(window.wcCipProjects || []);
      ready.then(function(){
        var projects = (typeof getSearchableProjects === "function") ? getSearchableProjects() : (window.wcCipProjects || []);
        Object.keys(CAPITAL_LEDGER_PROJECT_MATCHERS).forEach(function(key){
          var matcher = CAPITAL_LEDGER_PROJECT_MATCHERS[key];
          var amount = projects.filter(matcher).reduce(function(sum, project){
            return sum + ((typeof projectYearValue === "function") ? projectYearValue(project, "FY2027") : 0);
          }, 0);
          setCapitalLedgerAmount(key, amount);
        });
      }).catch(function(){
        Object.keys(CAPITAL_LEDGER_PROJECT_MATCHERS).forEach(function(key){ setCapitalLedgerAmount(key, 0); });
      });
    }

    document.addEventListener("DOMContentLoaded", function(){
      renderHub();
      renderBudgetTotals();
      renderCapitalTotal();
      renderCapitalLedgerFundTotals();
      renderCapitalLedgerProjectTotals();
    });
  })();
</script>
</body>
</html>
