  <aside class="wc-savings-card" aria-label="Estimated consultant costs avoided">
    <p class="wc-savings-card-kicker">Estimated Consultant Costs Avoided</p>

<script>
  // In-House Engineering Savings is the sum of every CIP project's own
  // "In-House Engineering" sheet value (see cip-projects-data.js's
  // in_house_engineering_value) rather than a fixed figure, so it tracks
  // whatever the FY2027 sheet says without a manual update here.
  (window.wcCipProjectsReady || Promise.resolve()).then(function () {
    const el = document.getElementById("wc-engineering-savings-value");
    if (!el) return;
    const projects = Array.isArray(window.wcCipProjects) ? window.wcCipProjects : [];
    const total = projects.reduce((sum, p) => sum + (Number(p && p.in_house_engineering_value) || 0), 0);
    el.textContent = "$" + Math.round(total).toLocaleString("en-US");
  });
</script>
