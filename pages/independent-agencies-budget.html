<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Independent Agencies Budget Explorer — Walton County FY 2027 Budget</title>
<link rel="stylesheet" href="../assets/style.css?v=20260808-independent-agencies-shared-data">
</head>
<body>
<nav id="nav-menu" class="nav-menu"><div class="logo-container"></div></nav>
<div id="layout"><main id="content">
  <div class="page-eyebrow wc-sr-only">Independent Agencies</div>
  <h1 class="page-title wc-sr-only">Independent Agencies Budget Explorer</h1>
  <section id="independent-agencies-budget-explorer" aria-label="Independent Agencies Budget Explorer">
    <div class="wc-data-loading"><span class="wc-loading-dots" aria-label="Loading independent agencies budgets"><span></span><span></span><span></span></span></div>
  </section>
</main></div>
<script src="../assets/search-data.js"></script>
<script src="../assets/budget-data.js?v=20260808-independent-agencies-shared-data"></script>
<script src="../assets/independent-agencies-data.js?v=20260808-independent-agencies-shared-data"></script>
<script src="../assets/nav.js?v=20260807-breadcrumb-ledgers"></script>
<script>
  (function(){
    function escapeHtml(value){
      return String(value === undefined || value === null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function compactCurrency(value){
      var n = Number(value) || 0;
      if(Math.abs(n) >= 1000000) return "$" + (n / 1000000).toLocaleString("en-US", { maximumFractionDigits:1 }) + "M";
      if(Math.abs(n) >= 1000) return "$" + Math.round(n / 1000).toLocaleString("en-US") + "K";
      return "$" + Math.round(n).toLocaleString("en-US");
    }

    function formatNumber(value){
      var n = Number(value) || 0;
      return n.toLocaleString("en-US", { maximumFractionDigits:(n % 1 !== 0) ? 1 : 0 });
    }

    function cardHtml(item, totalBudget){
      var change = item.budget - item.priorBudget;
      var changePct = item.priorBudget ? (change / Math.abs(item.priorBudget) * 100) : null;
      var shareOfTotal = totalBudget ? (item.budget / totalBudget * 100) : 0;
      var costChangeHtml = '<div class="wc-revenue-comparison"><span>Compared to Prior Year</span><div><strong>' +
        (change >= 0 ? "+" : "−") + escapeHtml(compactCurrency(Math.abs(change))) + '</strong><em>' +
        (changePct === null ? "No FY 2026 base" : (changePct >= 0 ? "+" : "") + changePct.toFixed(1) + "%") + '</em></div></div>';
      var fteBadge = item.fte ? '<span class="wc-personnel-dept-fte-badge">' + escapeHtml(formatNumber(item.fte)) + ' FTE</span>' : "";
      var fundLine = item.fund && item.fund !== "Not listed"
        ? '<small class="wc-revenue-card-share">' + escapeHtml(item.fund) + '</small>'
        : '<small class="wc-revenue-card-share">' + shareOfTotal.toFixed(1) + '% of independent agencies budget</small>';
      return '<a href="' + escapeHtml(item.href) + '"><div class="wc-revenue-card-head"><div class="wc-revenue-card-head-main"><strong>' +
        escapeHtml(item.name) + '</strong><b class="wc-revenue-card-amount">' + escapeHtml(compactCurrency(item.budget)) + '</b>' +
        fundLine + '</div><div class="wc-revenue-card-badge-stack">' + fteBadge + '</div></div>' +
        '<div class="wc-revenue-snapshot-change' + (change < 0 ? " is-down" : "") + '">' + costChangeHtml + '</div></a>';
    }

    function render(items, countywideBudget){
      var explorer = document.getElementById("independent-agencies-budget-explorer");
      if(!explorer) return;
      var totalBudget = items.reduce(function(sum, item){ return sum + (item.budget || 0); }, 0);
      var totalPrior = items.reduce(function(sum, item){ return sum + (item.priorBudget || 0); }, 0);
      var totalFte = items.reduce(function(sum, item){ return sum + (item.fte || 0); }, 0);
      var change = totalBudget - totalPrior;
      var changePct = totalPrior ? (change / Math.abs(totalPrior) * 100) : null;
      var shareOfBudgetPct = countywideBudget ? (totalBudget / countywideBudget * 100) : 0;

      var compositionHtml = countywideBudget
        ? '<p class="wc-revenue-concentration-summary"><strong>' + Math.round(shareOfBudgetPct) +
          '%</strong> of the total expenditure budget is independent agency funding.</p>'
        : "";

      var headHtml = '<div class="wc-department-explorer-head"><div><h2>Independent Agencies Budget Explorer</h2>' +
        '<p>Walton County budgets a combined ' + escapeHtml(compactCurrency(totalBudget)) + ' across ' + items.length +
        ' independent and autonomous entities not part of a County department or Constitutional Officer' +
        (totalFte ? ', employing ' + escapeHtml(formatNumber(totalFte)) + ' FTE' : '') +
        '. Select any entity below to review its budget, staffing, and service information.</p>' + compositionHtml + '</div>' +
        '<aside class="wc-revenue-total-budget"><span>Total Independent Agencies Budget</span><strong>' +
        escapeHtml(window.WCBudgetData ? window.WCBudgetData.formatCurrency(totalBudget) : compactCurrency(totalBudget)) + '</strong>' +
        '<small class="wc-revenue-total-change' + (change < 0 ? " is-decrease" : change > 0 ? " is-increase" : "") + '">' +
        (change >= 0 ? "+" : "−") + escapeHtml(compactCurrency(Math.abs(change))) + ' (' +
        (changePct === null ? "No FY 2026 base" : (changePct >= 0 ? "+" : "−") + Math.abs(changePct).toFixed(1) + "%") + ')</small>' +
        '<div class="wc-revenue-view-actions"><a class="wc-revenue-ledger-trigger" href="independent-agencies-ledger.html">View Independent Agencies Ledger</a></div></aside></div>';

      var cardsHtml = items.map(function(item){ return cardHtml(item, totalBudget); }).join("");

      explorer.innerHTML = '<section class="wc-department-explorer">' + headHtml +
        '<div class="wc-department-budget-cards">' + cardsHtml + '</div></section>';
    }

    document.addEventListener("DOMContentLoaded", function(){
      if(!window.WCIndependentAgencies) return;
      Promise.all([
        window.WCIndependentAgencies.load(),
        (window.WCBudgetData && window.WCBudgetData.loadBudgetData)
          ? window.WCBudgetData.loadBudgetData().then(window.WCBudgetData.totalCountywideExpenditureBudget)
          : Promise.resolve(0)
      ]).then(function(results){ render(results[0], results[1]); });
    });
  })();
</script>
</body>
</html>
