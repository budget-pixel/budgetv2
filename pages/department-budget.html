<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Department Budget — Walton County FY 2027 Budget</title>
<link rel="stylesheet" href="../assets/style.css?v=20260802-metric-changes">
</head>
<body>
<nav id="nav-menu" class="nav-menu"><div class="logo-container"></div></nav>
<div id="layout"><main id="content">
  <div class="page-eyebrow wc-sr-only">Department Budgets</div>
  <h1 class="page-title wc-sr-only">Department Budgets</h1>

  <section id="department-budget-explorer" aria-label="Department Budget Explorer">
    <div class="wc-data-loading"><span class="wc-loading-dots" aria-label="Loading department budgets"><span></span><span></span><span></span></span></div>
  </section>

  <div class="wc-department-explorer-list-footer">
    <button type="button" class="wc-department-list-link" id="departmentListToggle" aria-expanded="false" aria-controls="departmentListSection">Browse Department List <span class="wc-department-list-link-icon" aria-hidden="true">&darr;</span></button>
  </div>

  <h2 class="wc-department-directory-heading" id="departmentListHeading" hidden>Browse departments</h2>
  <section aria-label="Department directory" id="departmentListSection" hidden>
    <ul class="wc-directory-list" id="departmentList"></ul>
  </section>

  <section id="department-budget-questions" class="wc-revenue-questions" aria-label="Department budget build checklist"></section>
</main></div>
<script src="../assets/search-data.js"></script>
<script src="../assets/budget-data.js?v=20260804-drop-card-rank"></script>
<script src="../assets/budget-pdf.js?v=20260723-asset-path-cleanup"></script>
<script src="../assets/departments-directory.js?v=20260802-county-admin-fix"></script>
<script src="../assets/nav.js?v=20260804-financial-overview-rename"></script>
<script>
  (function(){
    var toggle = document.getElementById("departmentListToggle");
    var heading = document.getElementById("departmentListHeading");
    var section = document.getElementById("departmentListSection");
    if(!toggle || !heading || !section) return;
    toggle.addEventListener("click", function(){
      var expanded = toggle.getAttribute("aria-expanded") === "true";
      expanded = !expanded;
      toggle.setAttribute("aria-expanded", String(expanded));
      heading.hidden = !expanded;
      section.hidden = !expanded;
      toggle.firstChild.textContent = expanded ? "Hide Department List " : "Browse Department List ";
      if(expanded) section.scrollIntoView({ behavior:"smooth", block:"start" });
    });
  })();
</script>
</body>
</html>
