<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capital Budget — Walton County FY 2027 Budget</title>
<link rel="stylesheet" href="../assets/style.css?v=20260806-composition-layout">
</head>
<body>

<!-- nav#nav-menu.nav-menu is the hook nav.js uses for logo + search injection -->
<nav id="nav-menu" class="nav-menu">
  <div class="logo-container"></div>
</nav>

<div id="layout">
<main id="content">

<div class="page-eyebrow wc-sr-only">Capital Budget</div>
<h1 class="page-title wc-sr-only">Capital Budget</h1>
<section id="capital-budget-explorer" aria-label="Capital Budget Explorer">
  <div class="wc-data-loading"><span class="wc-loading-dots" aria-label="Loading capital budget"><span></span><span></span><span></span></span></div>
</section>

<section aria-label="Capital budget directory" id="capitalDirectorySection" hidden>
  <ul class="wc-directory-list" id="capitalDirectory"></ul>
</section>

</main>
</div>

<script src="../assets/search-data.js"></script>
<script src="../assets/cip-projects-data.js?v=20260802-fund-placeholders"></script>
<script src="../assets/cip-overview.js?v=20260802-capital-explorer"></script>
<script src="../assets/budget-data.js?v=20260806-total-budget-fix"></script>
<script src="../assets/nav.js?v=20260807-budget-ledgers-label"></script>
<script src="../assets/budget-pdf.js?v=20260723-asset-path-cleanup"></script>
<script>
  (function(){
    // "funding"/"fundings" matches each fund schedule page's own
    // renderFundSchedule config (see cip-fund-schedule.js). Sheriff
    // Projects is a standalone rollup of all Sheriff's Office projects
    // regardless of funding source, so its totals intentionally overlap
    // with whichever fund page each project's funding source belongs to.
    var pages = [
      {
        title:"Capital Improvement Plan Overview",
        href:"capital-improvement-plan.html",
        description:"Review the County's capital improvement plan overview, priorities, totals, and project portfolio context."
      },
      {
        title:"Machinery, Vehicles, & Equipment Ledger",
        href:"summary-of-machinery-vehicles-and-equipment.html",
        description:"Review budgeted machinery, vehicles, and equipment by department, fund, and equipment type.",
        metric:"machinery"
      },
      {
        title:"Project Search",
        href:"search.html",
        description:"Search capital projects by name, fund, department, district, and project detail."
      },
      {
        title:"Transportation and Infrastructure Ledger",
        priorFunds:["101","300","001"],
        href:"cip-capital-projects.html",
        description:"Review Transportation Fund, Capital Projects Fund, and grant-funded infrastructure in one schedule, with the funding source identified for every project.",
        // Grant-funded work is listed on that page in its own sub-ledger
        // with its own total and is paid for by the awarding agency, so it
        // stays out of this card's amount -- keeping it equal to the
        // ledger's FY 2027 headline total.
        match:function(project){
          if(String(project && project.department_filter || "").toLowerCase() === "sheriff"){
            return false;
          }
          var funding = String(project && project.funding || "").toLowerCase();
          return funding === "transportation fund" || funding === "capital projects fund" ||
            funding === "general fund";
        }
      },
      {
        title:"Tourist Development Fund Ledger",
        priorFunds:["111"],
        href:"cip-tourist-development.html",
        description:"Explore tourism-related capital investments funded through tourist development resources.",
        // Matches the ledger's headline total, which lists US 331 Bridge
        // Lighting separately because it is funded elsewhere in the budget.
        match:function(project){
          return String(project && project.funding || "").toLowerCase() === "tourist development fund" &&
            String(project && project.title || "").toLowerCase().indexOf("us 331 bridge lighting") === -1;
        }
      },
      {
        title:"Sheriff Project Ledger",
        priorFunds:["107"],
        href:"cip-sheriff.html",
        description:"Review all capital projects associated with the Walton County Sheriff's Office.",
        // Matches the ledger's headline total, which lists grant-funded work
        // in its own sub-ledger rather than the County-funded total.
        match:function(project){
          return String(project && project.department_filter || "").toLowerCase() === "sheriff" &&
            String(project && project.funding || "").toLowerCase() !== "grant funded";
        }
      },
      {
        title:"Recreation Plat Fee Fund Ledger",
        budgetFunds:["114"],
        priorFunds:["114"],
        href:"recreation-plat-fee-fund.html",
        description:"Review the Recreation Plat Fee Fund's FY 2027 budgeted capital amount, pending Board direction on specific projects.",
        funding:"recreation plat fee fund"
      },
      {
        title:"Sidewalk Fund Ledger",
        budgetFunds:["115"],
        priorFunds:["115"],
        href:"sidewalk-fund.html",
        description:"Review the Sidewalk Fund's FY 2027 budgeted capital amount, pending Board direction on specific projects.",
        funding:"sidewalk fund"
      }
    ];

    function escapeHtml(value){
      return String(value === undefined || value === null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatMoneyShort(value){
      var amount = Number(value) || 0;
      var abs = Math.abs(amount);
      if(abs >= 1000000){
        return "$" + (amount / 1000000).toLocaleString("en-US", { maximumFractionDigits:1 }) + "M";
      }
      if(abs >= 1000){
        return "$" + (amount / 1000).toLocaleString("en-US", { maximumFractionDigits:0 }) + "K";
      }
      return "$" + Math.round(amount).toLocaleString("en-US");
    }

    function formatMoneyFull(value){
      return "$" + Math.round(Number(value) || 0).toLocaleString("en-US");
    }

    // Same exclusions the Consolidated Schedule/Personnel Explorer use for
    // "Total All Funds": the Self-Insurance Fund (503) and interfund
    // transfers/other financing sources are internal pass-throughs, not
    // real county spending, so they're left out of the countywide
    // denominator this page uses for "capital funding is X% of the total
    // budget". BCC Other Uses Contingency (00101001/599000) is real
    // appropriation authority, not a transfer, so it stays counted despite
    // its "Other Sources" activity label.
    // Activity is looked up from the Activities sheet by Dept_Code (same as
    // budget-data.js's own activityForDeptCode) rather than read off the
    // expenditure row directly -- normalizeExpenditureRow only keeps a
    // fixed whitelist of fields, and "activity" isn't one of them, so a raw
    // row here never carries it.
    function activityForDeptCode(deptCode, activities){
      var code = String(deptCode || "").trim();
      if(!code) return "";
      var match = (activities || []).find(function(a){ return a.Dept_Code === code; });
      return match ? match.Activity : "";
    }
    function isExcludedFromCountywideTotal(row, activities){
      var deptCode = String(row.Dept_Code || "").trim();
      if(deptCode.slice(0, 3) === "503") return true;
      if(deptCode === "00101001" && String(row.Object_Code || "").trim() === "599000") return false;
      var activity = activityForDeptCode(deptCode, activities).trim().toLowerCase();
      return activity === "interfund transfers" || activity === "other sources";
    }

    function isLegacyInHouseEngineeringRow(project){
      var title = String(project.title || "").toLowerCase();
      var accountCode = String(project.budget_account_code || "").trim();
      return Boolean(project.is_legacy_in_house_engineering_row) ||
        title.indexOf("in-house engineering") !== -1 ||
        accountCode === "534000";
    }

    function getFy2027Amount(project){
      var rows = Array.isArray(project.funding_by_year) ? project.funding_by_year : [];
      var fy2027 = rows.filter(function(r){ return r.year === "FY2027"; });
      return fy2027.reduce(function(sum, r){ return sum + (Number(r.amount_value) || 0); }, 0);
    }

    function getInHouseEngineeringAmount(project){
      if(Number(project.in_house_engineering_value || 0) > 0){
        return Number(project.in_house_engineering_value) || 0;
      }
      var rows = Array.isArray(project.in_house_engineering_rows) ? project.in_house_engineering_rows : [];
      return rows.reduce(function(sum, r){ return sum + (Number(r.amount_value) || 0); }, 0);
    }

    // Bouncing-dots markup shown in place of a real stat value while
    // wcCipProjectsReady hasn't resolved yet (see style.css's
    // .wc-loading-dots) -- otherwise renderDirectory([]) renders real-
    // looking "$0"/"0" stats immediately, which then jump to their real
    // values once project data loads instead of reading as still-loading.
    var LOADING_DOTS_HTML = '<span class="wc-loading-dots" aria-hidden="true"><span></span><span></span><span></span></span>';
    var currentProjects = [];
    var projectsLoading = true;
    var machineryTotal = null;
    var machineryItemCount = null;
    var machineryVehicleCount = null;
    var machineryEquipmentCount = null;
    var capitalOutlayPrior = null;
    // FY 2027 capital outlay straight from the expenditure budget (object
    // codes 560000-566000: Capital Outlay Budget, Land, Buildings,
    // Infrastructure, Machinery & Equipment, Library Materials) rather than
    // rolled up from the CIP project sheet -- the budgeted total is the
    // authoritative capital figure and reconciles to the expense summaries.
    var capitalOutlayTotal = null;
    // Total countywide FY 2027 proposed expenditures across every
    // department, office, and fund -- same source rows capital outlay
    // itself is drawn from, so "capital funding is X% of the total budget"
    // reconciles with the underlying data.
    var totalCountywideBudget2027 = null;
    // FY 2027 capital outlay by fund code -- lets a ledger card report the
    // budgeted amount straight from the expenditure sheet instead of a
    // stand-in project row (see budgetFunds below).
    var capitalOutlayByFund = null;
    // FY 2026 capital outlay by fund code (machinery objects excluded, since
    // those belong to the equipment ledger rather than a CIP fund ledger),
    // plus the machinery ledger's own prior-year total. Both feed the
    // per-card "Compared to Prior Year" line below.
    var capitalOutlayPriorByFund = null;
    var machineryPrior = null;
    var MACHINERY_OBJECT_CODE = "564000";
    var EXCLUDED_CAPITAL_OBJECT_CODES = [];

    function isCapitalOutlayRow(row){
      if(String(row.Object_Type || "").trim().toLowerCase() !== "capital outlay") return false;
      return EXCLUDED_CAPITAL_OBJECT_CODES.indexOf(String(row.Object_Code || "").trim()) === -1;
    }

    function statHtml(modifierClass, value, label){
      return '<div class="wc-directory-item-stat ' + modifierClass + '"><strong>' + value + '</strong><span>' + escapeHtml(label) + '</span></div>';
    }

    function pageProjectMatches(page, project){
      if(!project || isLegacyInHouseEngineeringRow(project)) return false;
      if(typeof page.match === "function"){
        return page.match(project);
      }
      if(page.departmentFilter){
        return String(project.department_filter || "").toLowerCase() === page.departmentFilter;
      }
      var projectFunding = String(project.funding || "").toLowerCase();
      if(Array.isArray(page.fundings)){
        return page.fundings.indexOf(projectFunding) !== -1;
      }
      return projectFunding === page.funding;
    }

    function projectStatsHtml(page, allProjects, isLoading){
      if(isLoading){
        return statHtml("wc-directory-item-stat--fund-budget", LOADING_DOTS_HTML, "FY 2027 Budget") +
          statHtml("wc-directory-item-stat--fund-projects", LOADING_DOTS_HTML, "Number of Projects") +
          statHtml("wc-directory-item-stat--fund-inhouse", LOADING_DOTS_HTML, "In-House Engineering");
      }
      var matching = allProjects.filter(function(p){
        return pageProjectMatches(page, p);
      });
      var projectCount = matching.filter(function(p){ return getFy2027Amount(p) > 0; }).length;
      var inHouseTotal = matching.reduce(function(sum, p){ return sum + getInHouseEngineeringAmount(p); }, 0);
      var budgetTotal = matching.reduce(function(sum, p){ return sum + getFy2027Amount(p); }, 0);

      return statHtml("wc-directory-item-stat--fund-budget", escapeHtml(formatMoneyShort(budgetTotal)), "FY 2027 Budget") +
        statHtml("wc-directory-item-stat--fund-projects", escapeHtml(projectCount.toLocaleString("en-US")), "Number of Projects") +
        statHtml("wc-directory-item-stat--fund-inhouse", escapeHtml(formatMoneyShort(inHouseTotal)), "In-House Engineering");
    }

    function renderDirectory(allProjects, isLoading){
      var list = document.getElementById("capitalDirectory");
      if(!list) return;

      list.innerHTML = pages.map(function(page){
        var statsHtml = "";
        if(page.metric === "machinery"){
          statsHtml = '<div class="wc-directory-item-meta">' +
            statHtml("wc-directory-item-stat--overview-budget", machineryTotal === null ? LOADING_DOTS_HTML : escapeHtml(formatMoneyShort(machineryTotal)), "FY 2027 Budget") +
            statHtml("wc-directory-item-stat--fund-projects", machineryVehicleCount === null ? LOADING_DOTS_HTML : escapeHtml(machineryVehicleCount.toLocaleString("en-US")), "Number of Vehicles") +
            statHtml("wc-directory-item-stat--fund-inhouse", machineryEquipmentCount === null ? LOADING_DOTS_HTML : escapeHtml(machineryEquipmentCount.toLocaleString("en-US")), "Number of Machinery & Equipment") +
            '</div>';
        }else if(page.funding || page.fundings || page.departmentFilter || page.match){
          statsHtml = '<div class="wc-directory-item-meta">' + projectStatsHtml(page, allProjects, isLoading) + '</div>';
        }
        return '<li><a class="wc-directory-item" href="' + escapeHtml(page.href) + '">' +
          '<div class="wc-directory-item-main">' +
            '<span class="wc-directory-item-title">' + escapeHtml(page.title) + '</span>' +
            '<span class="wc-directory-item-desc">' + escapeHtml(page.description) + '</span>' +
          '</div>' +
          statsHtml +
          '<span class="wc-directory-item-arrow" aria-hidden="true">&rarr;</span>' +
        '</a></li>';
      }).join("");
    }

    // Ledger pages are every directory entry that maps to a specific fund,
    // department, or machinery/vehicles/equipment schedule (same condition
    // renderDirectory already uses to decide whether to show stats) --
    // excludes the general "Capital Improvement Plan Overview" and
    // "Project Search" entries, which aren't a single ledger to explore.
    var ledgerPages = pages.filter(function(page){
      return page.metric === "machinery" || page.funding || page.fundings || page.departmentFilter || page.match;
    });

    function ledgerCardStats(page){
      if(page.metric === "machinery"){
        var vehicles = machineryVehicleCount || 0;
        var equipment = machineryEquipmentCount || 0;
        return { budget: machineryTotal || 0, badges: [vehicles.toLocaleString("en-US") + " vehicles", equipment.toLocaleString("en-US") + " equipment"] };
      }
      // Funds whose ledger has no individual Board-directed projects yet
      // report the budgeted fund amount from the expenditure sheet rather
      // than a placeholder project row -- no project/vehicle count exists
      // to badge.
      if(page.budgetFunds && capitalOutlayByFund){
        return {
          budget: page.budgetFunds.reduce(function(sum, fundCode){
            return sum + (capitalOutlayByFund[fundCode] || 0);
          }, 0)
        };
      }
      var matching = currentProjects.filter(function(p){ return pageProjectMatches(page, p); });
      var budget = matching.reduce(function(sum, p){ return sum + getFy2027Amount(p); }, 0);
      var count = matching.filter(function(p){ return getFy2027Amount(p) > 0; }).length;
      return { budget: budget, badges: [count.toLocaleString("en-US") + (count === 1 ? " project" : " projects")] };
    }

    // FY 2026 comparison for a ledger card, or null when the ledger has no
    // prior-year capital budget to compare against (the CIP Overview and
    // Project Search cards aren't a fund).
    function ledgerCardPrior(page){
      if(page.metric === "machinery") return machineryPrior;
      if(!page.priorFunds || !capitalOutlayPriorByFund) return null;
      return page.priorFunds.reduce(function(sum, fundCode){
        return sum + (capitalOutlayPriorByFund[fundCode] || 0);
      }, 0);
    }

    function ledgerCardChangeHtml(page, budget){
      var prior = ledgerCardPrior(page);
      if(prior === null) return "";
      var change = budget - prior;
      var changePct = prior ? (change / Math.abs(prior)) * 100 : null;
      var isDown = change < 0;
      return '<div class="wc-revenue-snapshot-change' + (isDown ? " is-down" : "") + '"><div class="wc-revenue-comparison"><span>Compared to Prior Year</span><div><strong>' +
        (change >= 0 ? "+" : "−") + escapeHtml(formatMoneyShort(Math.abs(change))) + '</strong><em>' +
        (changePct === null ? "No prior-year base" : (changePct >= 0 ? "+" : "") + Math.abs(changePct).toFixed(1) + '%') + '</em></div></div></div>';
    }

    function ledgerCardHtml(page, totalCapitalBudget){
      var stats = ledgerCardStats(page);
      var badgeHtml = stats.badges && stats.badges.length ?
        '<div class="wc-revenue-card-badge-stack">' + stats.badges.map(function(b){ return '<span class="wc-personnel-dept-fte-badge">' + escapeHtml(b) + '</span>'; }).join("") + '</div>' : "";
      var sharePct = totalCapitalBudget ? (stats.budget / totalCapitalBudget * 100) : 0;
      var shareHtml = '<small class="wc-revenue-card-share">' + sharePct.toFixed(1) + '% of capital budget</small>';
      return '<a href="' + escapeHtml(page.href) + '"><div class="wc-revenue-card-head"><div class="wc-revenue-card-head-main"><strong>' + escapeHtml(page.title) + '</strong><b class="wc-revenue-card-amount">' + escapeHtml(formatMoneyShort(stats.budget)) + '</b>' + shareHtml + '</div>' + badgeHtml + '</div>' + ledgerCardChangeHtml(page, stats.budget) + '</a>';
    }

    function renderCapitalBudgetExplorer(){
      var explorer = document.getElementById("capital-budget-explorer");
      if(!explorer) return;
      if(projectsLoading || machineryTotal === null || capitalOutlayTotal === null){
        explorer.innerHTML = '<div class="wc-data-loading"><span class="wc-loading-dots" aria-label="Loading capital budget"><span></span><span></span><span></span></span></div>';
        return;
      }
      var combinedTotal = capitalOutlayTotal || 0;
      var fy2027Total = combinedTotal - (machineryTotal || 0);
      var prior = capitalOutlayPrior || 0;
      var change = combinedTotal - prior;
      var changePct = prior ? (change / Math.abs(prior)) * 100 : null;
      var changeHtml = '<small class="wc-revenue-total-change ' + (change > 0 ? "is-increase" : change < 0 ? "is-decrease" : "") + '">' +
        (change >= 0 ? "+" : "−") + escapeHtml(formatMoneyShort(Math.abs(change))) +
        ' (' + (changePct === null ? "No prior-year base" : (changePct >= 0 ? "+" : "−") + Math.abs(changePct).toFixed(1) + '%') + ')</small>';
      var capitalShareOfBudgetPct = totalCountywideBudget2027 ? (combinedTotal / totalCountywideBudget2027 * 100) : 0;
      var fy2027SharePct = combinedTotal ? (fy2027Total / combinedTotal * 100) : 0;
      var machinerySharePct = combinedTotal ? ((machineryTotal || 0) / combinedTotal * 100) : 0;
      var compositionHtml = '<div class="wc-revenue-card-summary-row"><p class="wc-revenue-concentration-summary"><strong>' + Math.round(capitalShareOfBudgetPct) + '%</strong> of the total expenditure budget is capital funding.</p><div class="wc-revenue-support-split"><div><span>Capital Projects</span><div class="wc-revenue-support-amount-row"><b>' + escapeHtml(formatMoneyShort(fy2027Total)) + '</b><small>' + fy2027SharePct.toFixed(1) + '% of capital budget</small></div></div><div><span>Machinery, Vehicles &amp; Equipment</span><div class="wc-revenue-support-amount-row"><b>' + escapeHtml(formatMoneyShort(machineryTotal)) + '</b><small>' + machinerySharePct.toFixed(1) + '% of capital budget</small></div></div></div></div>';
      explorer.innerHTML = '<section class="wc-department-explorer"><div class="wc-department-explorer-head"><div><h2>Capital Budget Explorer</h2><p>Explore Walton County&rsquo;s capital improvement plan, fund ledgers, machinery and equipment, and searchable project detail.</p><p>Start with the total capital budget below, or select a ledger card to review its projects, funding sources, and year-over-year change.</p></div>' +
        '<aside class="wc-revenue-total-budget"><div class="wc-revenue-total-primary"><span>Total capital budget</span><strong>' + escapeHtml(formatMoneyFull(combinedTotal)) + '</strong>' + changeHtml + '<div class="wc-revenue-view-actions"><a class="wc-revenue-ledger-trigger" href="capital-improvement-plan.html#wc-cip-what-counts">What is a Capital Project?</a><a class="wc-revenue-ledger-trigger" href="search.html">Project Search</a></div></div></aside></div>' +
        compositionHtml +
        '<div class="wc-department-budget-cards">' + ledgerPages.map(function(page){ return ledgerCardHtml(page, combinedTotal); }).join("") + '</div></section>';
    }

    function initCapitalDirectoryToggle(){
      var toggle = document.getElementById("capitalDirectoryToggle");
      var section = document.getElementById("capitalDirectorySection");
      if(!toggle || !section) return;
      toggle.addEventListener("click", function(){
        var expanded = toggle.getAttribute("aria-expanded") === "true";
        expanded = !expanded;
        toggle.setAttribute("aria-expanded", String(expanded));
        section.hidden = !expanded;
        toggle.firstChild.textContent = expanded ? "Hide Capital Budget Directory " : "Browse Capital Budget Directory ";
        if(expanded) section.scrollIntoView({ behavior:"smooth", block:"start" });
      });
    }

    document.addEventListener("DOMContentLoaded", function(){
      renderDirectory(currentProjects, projectsLoading);
      renderCapitalBudgetExplorer();
      initCapitalDirectoryToggle();
      var ready = window.wcCipProjectsReady || Promise.resolve(window.wcCipProjects || []);
      ready.then(function(projects){
        currentProjects = Array.isArray(projects) ? projects : (window.wcCipProjects || []);
        projectsLoading = false;
        renderDirectory(currentProjects, projectsLoading);
        renderCapitalBudgetExplorer();
      }).catch(function(){
        currentProjects = window.wcCipProjects || [];
        projectsLoading = false;
        renderDirectory(currentProjects, projectsLoading);
        renderCapitalBudgetExplorer();
      });
      if(window.WCBudgetData && typeof window.WCBudgetData.loadBudgetData === "function"){
        window.WCBudgetData.loadBudgetData().then(function(data){
          var machineryRows = data.machinery || [];
          machineryTotal = machineryRows.reduce(function(sum, row){ return sum + (Number(row.Amount) || 0); }, 0);
          machineryItemCount = machineryRows.length;
          machineryVehicleCount = machineryRows.filter(function(row){ return /^vehicles?$/i.test(String(row.ME_Type || "").trim()); }).length;
          machineryEquipmentCount = machineryItemCount - machineryVehicleCount;
          capitalOutlayTotal = (data.expenditures || []).reduce(function(sum, row){
            return isCapitalOutlayRow(row) ? sum + (Number(row.FY2027_Proposed) || 0) : sum;
          }, 0);
          totalCountywideBudget2027 = (data.expenditures || []).reduce(function(sum, row){
            return isExcludedFromCountywideTotal(row, data.activities) ? sum : sum + (Number(row.FY2027_Proposed) || 0);
          }, 0);
          capitalOutlayPrior = (data.expenditures || []).reduce(function(sum, row){
            return isCapitalOutlayRow(row) ? sum + (Number(row.FY2026_Original_Budget || row.FY2026_Budget) || 0) : sum;
          }, 0);
          capitalOutlayByFund = {};
          capitalOutlayPriorByFund = {};
          machineryPrior = 0;
          (data.expenditures || []).forEach(function(row){
            if(!isCapitalOutlayRow(row)) return;
            var amount = Number(row.FY2026_Original_Budget || row.FY2026_Budget) || 0;
            if(!amount) return;
            if(String(row.Object_Code || "").trim() === MACHINERY_OBJECT_CODE){
              machineryPrior += amount;
              return;
            }
            var fundCode = String(row.Dept_Code || "").trim().slice(0, 3);
            if(!fundCode) return;
            capitalOutlayPriorByFund[fundCode] = (capitalOutlayPriorByFund[fundCode] || 0) + amount;
          });
          (data.expenditures || []).forEach(function(row){
            if(!isCapitalOutlayRow(row)) return;
            var amount = Number(row.FY2027_Proposed) || 0;
            if(!amount) return;
            var fundCode = String(row.Dept_Code || "").trim().slice(0, 3);
            if(!fundCode) return;
            capitalOutlayByFund[fundCode] = (capitalOutlayByFund[fundCode] || 0) + amount;
          });
          renderDirectory(currentProjects, projectsLoading);
          renderCapitalBudgetExplorer();
        }).catch(function(){
          machineryTotal = 0;
          machineryItemCount = 0;
          capitalOutlayTotal = 0;
          capitalOutlayPrior = 0;
          capitalOutlayByFund = {};
          capitalOutlayPriorByFund = {};
          machineryPrior = 0;
          machineryVehicleCount = 0;
          machineryEquipmentCount = 0;
          renderDirectory(currentProjects, projectsLoading);
          renderCapitalBudgetExplorer();
        });
      }
    });
  })();
</script>
</body>
</html>
