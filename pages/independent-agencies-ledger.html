<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Independent Agencies Ledger — Walton County FY 2027 Budget</title>
<link rel="stylesheet" href="../assets/style.css?v=20260808-independent-agencies-shared-data">
</head>
<body>
<nav id="nav-menu" class="nav-menu"><div class="logo-container"></div></nav>
<div id="layout"><main id="content">
<div class="page-eyebrow">Financial Overview</div>
<div class="wc-page-title-row"><h1 class="page-title">Independent Agencies Ledger</h1><a class="wc-asset-back" href="independent-agencies-budget.html">← Back to Explorer</a></div>
<p class="page-intro">Compare budget, fund, personnel, operating, and capital cost across the Courts, Health Department, and other independent and autonomous entities not part of a County department or Constitutional Officer.</p>

<section aria-label="Independent Agencies Budget Ledger">
  <div class="wc-department-ledger wc-ledger-page-flush" id="independentAgenciesLedger"></div>
</section>

</main></div>
<script src="../assets/search-data.js"></script>
<script src="../assets/budget-data.js?v=20260808-independent-agencies-shared-data"></script>
<script src="../assets/independent-agencies-data.js?v=20260808-independent-agencies-shared-data"></script>
<script src="../assets/nav.js?v=20260807-breadcrumb-ledgers"></script>
<script>
  (function(){
    function escapeHtml(value){
      return String(value === undefined || value === null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Bouncing-dots markup shown in place of the literal "Loading" text
    // while loadBudgetData() is in flight (see style.css's .wc-loading-dots).
    var LOADING_DOTS_HTML = '<span class="wc-loading-dots" aria-hidden="true"><span></span><span></span><span></span></span>';

    function formatCurrency(value){
      var n = Number(value) || 0;
      if(!n) return "Not listed";
      if(Math.abs(n) >= 1000000){
        return "$" + (n / 1000000).toLocaleString("en-US", { maximumFractionDigits:1 }) + "M";
      }
      return "$" + Math.round(n).toLocaleString("en-US");
    }

    function moneyCellHtml(value){
      return '<td class="wc-num">' + escapeHtml(window.WCBudgetData ? window.WCBudgetData.formatCurrency(value) : formatCurrency(value)) + '</td>';
    }

    function changeCellHtml(current, prior){
      var change = current - prior;
      var cls = change > 0 ? "is-increase" : change < 0 ? "is-decrease" : "";
      var sign = change > 0 ? "+" : change < 0 ? "−" : "";
      var amount = window.WCBudgetData ? window.WCBudgetData.formatCurrency(Math.abs(change)) : formatCurrency(Math.abs(change));
      return '<td class="wc-num ' + cls + '">' + sign + escapeHtml(amount) + '</td>';
    }

    function loadingRowHtml(item){
      return '<tr><td>' + escapeHtml(item.name) + '</td><td>' + escapeHtml(item.fund) + '</td>' +
        '<td class="wc-num">' + LOADING_DOTS_HTML + '</td><td class="wc-num">' + LOADING_DOTS_HTML + '</td>' +
        '<td class="wc-num">' + LOADING_DOTS_HTML + '</td><td class="wc-num">' + LOADING_DOTS_HTML + '</td>' +
        '<td class="wc-num">' + LOADING_DOTS_HTML + '</td></tr>';
    }

    function readyRowHtml(item){
      return '<tr><td><a class="wc-table-row-link" href="' + escapeHtml(item.href) + '">' + escapeHtml(item.name) + '</a></td>' +
        '<td>' + escapeHtml(item.fund && item.fund !== "Not listed" ? item.fund : "—") + '</td>' +
        moneyCellHtml(item.priorBudget) +
        moneyCellHtml(item.budget) +
        changeCellHtml(item.budget, item.priorBudget) +
        moneyCellHtml(item.personnel) +
        moneyCellHtml(item.operating) +
        '</tr>';
    }

    function totalRowHtml(items){
      var totals = items.reduce(function(sum, item){
        sum.budget += item.budget || 0;
        sum.priorBudget += item.priorBudget || 0;
        sum.personnel += item.personnel || 0;
        sum.operating += item.operating || 0;
        return sum;
      }, { budget:0, priorBudget:0, personnel:0, operating:0 });
      return '<tr class="wc-table-total-row"><td>Total Independent Agencies</td><td></td>' +
        moneyCellHtml(totals.priorBudget) +
        moneyCellHtml(totals.budget) +
        changeCellHtml(totals.budget, totals.priorBudget) +
        moneyCellHtml(totals.personnel) +
        moneyCellHtml(totals.operating) +
        '</tr>';
    }

    // No entity currently has FY2027 capital funding, so that column is
    // dropped rather than showing a column of all-zero amounts.
    var LEDGER_COLUMNS = [
      { label:"Entity" },
      { label:"Fund" },
      { label:"FY 2026 Budget", num:true },
      { label:"FY 2027 Proposed", num:true },
      { label:"+/−", num:true },
      { label:"Personnel", num:true },
      { label:"Operating", num:true }
    ];

    function renderItems(items){
      var host = document.getElementById("independentAgenciesLedger");
      if(!host) return;
      var isLoading = items.some(function(item){ return item.status === "loading"; });
      var bodyRows = items.map(isLoading ? loadingRowHtml : readyRowHtml);
      if(!isLoading) bodyRows.push(totalRowHtml(items));
      host.innerHTML = window.WCBudgetData
        ? window.WCBudgetData.renderTable({ caption:"Independent Agencies Budget Ledger", hideVisualCaption:true, columns:LEDGER_COLUMNS, bodyRows:bodyRows })
        : "";
    }

    document.addEventListener("DOMContentLoaded", function(){
      if(!window.WCIndependentAgencies) return;
      window.WCIndependentAgencies.load(renderItems).then(renderItems);
    });
  })();
</script>
</body>
</html>
