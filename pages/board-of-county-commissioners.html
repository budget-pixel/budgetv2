<style>
  /* Compact commissioner cards -- same rounded-card, hover-lift visual
     language as .wc-department-budget-cards on the Board Department
     Operating Budget Explorer (see style.css), applied here to a static
     photo/name/district grid instead of a clickable budget-figure card. */
  .wc-commissioner-cards{
    display:grid;
    grid-template-columns:repeat(5, minmax(0, 1fr));
    gap:10px;
    margin:0 0 28px;
  }

  .wc-commissioner-card{
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid rgba(0,63,40,.13);
    border-radius:13px;
    background:#fff;
    color:inherit;
    text-decoration:none;
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }

  .wc-commissioner-card:hover{
    border-color:var(--green);
    box-shadow:0 6px 16px rgba(0,63,40,.08);
    transform:translateY(-1px);
  }

  .wc-commissioner-card:focus-visible{
    outline:3px solid rgba(0,119,67,.38);
    outline-offset:3px;
  }

  .wc-commissioner-card img{
    display:block;
    width:100%;
    aspect-ratio:1 / 1;
    object-fit:cover;
    background:#eef1ec;
  }

  .wc-commissioner-card-body{
    padding:10px 12px 12px;
  }

  .wc-commissioner-card-district{
    display:block;
    color:var(--green);
    font-size:.68rem;
    font-weight:850;
    text-transform:uppercase;
  }

  .wc-commissioner-card-name{
    display:block;
    margin-top:4px;
    color:var(--navy);
    font-size:.88rem;
    font-weight:800;
    line-height:1.3;
  }

  @media (max-width: 900px){
    .wc-commissioner-cards{ grid-template-columns:repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 560px){
    .wc-commissioner-cards{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
  }
</style>
